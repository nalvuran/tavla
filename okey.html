<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12203a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Okey</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column, a walnut tavla box as the hero, controls docked under it like the table edge. */
:root{
  --room:#12203a;
  --room-2:#1b2b4a;
  --ink:#eef1f6;
  --muted:#a3b2c9;
  --brass:#d6ae57;
  --brass-ink:#13203a;
  --line:#2f4670;
  --frame:#1f3a66;
  --frame-2:#162c50;
  --field:#efe7d4;
  --pt-a:#1f4e8c;
  --pt-b:#c8503c;
  --ivory:#f7f3ea;
  --ivory-rim:#b7ae98;
  --ebony:#101a2e;
  --good:#8fc28a;
  --cloth:#f5f3ee;
  --check:rgba(31,78,140,.32);
  --weave:rgba(20,40,90,.10);
  --display:"Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background-color:var(--cloth);background-image:linear-gradient(90deg,var(--check) 50%,transparent 50%),linear-gradient(var(--check) 50%,transparent 50%),radial-gradient(circle at 1px 1px,var(--weave) 1px,transparent 1.4px);background-size:44px 44px,44px 44px,4px 4px;background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:900px;margin:0 auto;padding:0 16px;padding-block:0 28px;display:flex;flex-direction:column;gap:14px}
.play{display:flex;flex-direction:column;gap:10px;padding-top:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;margin:0;line-height:1;flex:none}
.acct{display:flex;align-items:center;gap:7px;background:var(--room-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;min-width:0}
.acct img{width:24px;height:24px;border-radius:50%;display:block;flex:none}
.acct .who{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.acct b{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.acct span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--room-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:transparent;border:0;border-radius:7px;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);font-weight:600}
.score{display:flex;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-weight:600;font-size:14px;margin-left:3px}
.boardwrap{position:relative;margin-inline:-12px}
svg#board{display:block;width:100%;height:auto;max-height:calc(100vh - 170px);max-height:calc(100dvh - 170px);min-height:220px;touch-action:manipulation;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.frame{fill:var(--frame)}
.frame-in{fill:var(--frame-2)}
.field{fill:var(--field)}
.pa{fill:var(--pt-a)}
.pb{fill:var(--pt-b)}
.mid{fill:var(--frame)}
.tray{fill:var(--frame-2)}
.lbl{fill:var(--muted);font:600 9px var(--body);text-anchor:middle;font-variant-numeric:tabular-nums}
.inlay{fill:none;stroke:var(--brass);stroke-opacity:.35;stroke-width:1}
.ck.w circle{fill:var(--ivory);stroke:var(--ivory-rim);stroke-width:1.5}
.ck.w circle.in{fill:none;stroke:var(--ivory-rim);stroke-width:1.2}
.ck.b circle{fill:var(--ebony);stroke:var(--brass);stroke-width:1.8}
.ck.b circle.in{fill:none;stroke:var(--brass);stroke-opacity:.55;stroke-width:1.2}
.ck.moving{filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.ck.sel circle:first-child{stroke:var(--brass);stroke-width:4}
.ck.can circle:first-child{stroke:var(--brass);stroke-width:2.5;stroke-dasharray:4 3}
.cnt{font:700 13px var(--body);text-anchor:middle;dominant-baseline:central}
.cnt.w{fill:var(--brass-ink)}
.cnt.b{fill:var(--ivory)}
.off.w{fill:var(--ivory);stroke:var(--ivory-rim)}
.off.b{fill:var(--ebony);stroke:var(--brass)}
.dest{fill:var(--brass);fill-opacity:.55;stroke:var(--brass);stroke-width:2}
.dest.far{fill-opacity:.32}
.destn{font:700 11px var(--body);fill:var(--brass-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.desttray{fill:var(--brass);fill-opacity:.25;stroke:var(--brass);stroke-width:2}
@media (prefers-reduced-motion:no-preference){.dest,.desttray{animation:pulse 1.1s ease-in-out infinite}}
@keyframes pulse{50%{fill-opacity:.2}}
.die rect{stroke-width:1.5}
.die.w rect{fill:var(--ivory);stroke:var(--ivory-rim)}
.die.w circle{fill:var(--ebony)}
.die.b rect{fill:var(--ebony);stroke:var(--brass)}
.die.b circle{fill:var(--ivory)}
.die.used{opacity:.3}
.hit{fill:transparent;cursor:pointer}
.info{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:2.6em;background:var(--room);border:1px solid var(--line);border-radius:12px;padding:7px 12px;box-shadow:0 3px 10px rgba(15,30,60,.25)}
.status{margin:0;font-size:14px;line-height:1.3;min-width:0}
.status b{color:var(--brass);font-weight:600}
.pips{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;flex:none;line-height:1.3}
.controls{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding-bottom:8px}
.btn.cubebtn{background:var(--pt-b);border-color:var(--pt-b);color:#fff}
.cube rect{fill:var(--ivory);stroke:var(--brass);stroke-width:2}
.cube text{font:700 12px var(--body);fill:var(--brass-ink);text-anchor:middle;dominant-baseline:central}
.cube.center rect{fill:var(--frame-2)}
.cube.center text{fill:var(--brass)}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:10px;padding:12px 6px;cursor:pointer;border:1px solid var(--line);background:var(--room-2);color:var(--ink);min-width:0}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn:not(.primary){background:var(--frame);border-color:#345a92;color:var(--ivory)}
.btn:disabled,.btn.primary:disabled{opacity:1;cursor:default;background:var(--room);border-color:var(--line);color:#7d8ca6}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.opt.mode{flex-wrap:wrap}
.confirm{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:868px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--room-2);border:1px solid var(--brass);border-radius:12px;padding:12px 14px}
.confirm p{margin:0;flex:1 1 200px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.over div{background:var(--room);border:1px solid var(--brass);border-radius:14px;padding:16px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.over h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 4px}
.over p{margin:0;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.match{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-variant-numeric:tabular-nums}
.match:empty{display:none}
.sb{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:18px;font-weight:600}
.sb .p{display:inline-flex;align-items:center;gap:8px;min-width:0;background:var(--field);color:var(--brass-ink);border-radius:999px;padding:3px 14px 3px 5px}
.sb .nm{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb b{color:var(--pt-b);font-size:22px;font-weight:700}
.sb .dot{width:22px;height:22px}
.sb .dot.b{border-width:2px}
.match .sub{font-size:12px;color:var(--muted);background:var(--room);border-radius:999px;padding:2px 12px}
.sb .p{background:none;border:0;box-shadow:none;padding:0;text-shadow:0 0 3px var(--cloth),0 0 6px var(--cloth)}
.sb b{color:var(--brass-ink)}
.acct,.seg,.garson,.btn:not(.primary){box-shadow:0 3px 10px rgba(15,30,60,.25)}
.note:empty{display:none}
.note{background:var(--room);border-radius:10px;padding:6px 10px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;vertical-align:-1px;margin-right:6px}
.sb .dot{margin-right:0}
.dot.w{background:var(--ivory);border:1px solid var(--ivory-rim)}
.dot.b{background:var(--ebony);border:1.5px solid var(--brass)}
.gear{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--room-2);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(15,30,60,.25)}
.gear.home{text-decoration:none}
header .acct{margin-right:auto}
.gear .ii{font:italic 400 16px var(--display);color:var(--brass);line-height:1}
#infoBtn{width:30px;height:30px}
.gear svg{width:22px;height:22px;fill:var(--ink)}
.gear:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt.vol input{flex:1;max-width:220px;accent-color:var(--brass)}
.opt.vol.off{opacity:.45}
.sw{flex:none;width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--room-2);position:relative;cursor:pointer;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.sw[aria-checked="true"]{background:var(--brass);border-color:var(--brass)}
.sw[aria-checked="true"] i{transform:translateX(22px);background:var(--brass-ink)}
.sw:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.garson{display:flex;align-items:center;gap:10px;width:100%;font:inherit;color:var(--ink);background:var(--room-2);border:1px solid var(--line);border-radius:12px;padding:8px 14px 8px 10px;cursor:pointer;margin-bottom:8px}
.garson svg{width:34px;height:34px;flex:none;fill:var(--ink)}
.garson svg .tie{fill:var(--brass)}
.garson svg .arm{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.garson .gl{font-weight:600;font-size:15px}
.garson .gt{margin-left:auto;color:var(--brass);font-weight:600;font-variant-numeric:tabular-nums}
.garson:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(5,10,22,.6)}
.panel{position:relative;width:100%;max-width:560px;max-height:82%;display:flex;flex-direction:column;gap:10px;background:var(--room);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.ph{display:flex;align-items:center;justify-content:space-between}
.ph h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.x{font:inherit;font-size:26px;line-height:1;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--room-2);color:var(--ink);cursor:pointer}
.tabs{display:flex}
.tabs button{flex:1}
.toast{margin:0;min-height:1.3em;font-size:13.5px;color:var(--good)}
.pb{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.cat{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 -4px}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--room-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;min-width:0;position:relative}
.item b{font-weight:600}
.item span{color:var(--brass);font-variant-numeric:tabular-nums;font-size:14px}
.item .q{position:absolute;top:8px;right:9px;background:var(--brass);color:var(--brass-ink);border-radius:999px;font-size:12px;font-weight:700;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.item:active{transform:scale(.98)}
.slip{background:#f8f5ee;color:#1b2b4a;border-radius:6px;padding:14px 16px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px #d5d9e2}
.slip h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 2px;text-align:center}
.slip .meta{text-align:center;font-size:12px;color:#5b6b85;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed #c8cfdc}
.row .qty{display:flex;align-items:center;gap:6px}
.row .qty button{font:inherit;font-weight:700;width:30px;height:30px;border-radius:8px;border:1px solid #c8cfdc;background:#ffffff;color:#1b2b4a;cursor:pointer}
.row .amt{min-width:72px;text-align:right}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:17px;padding-top:10px}
.slip .foot{font-size:12.5px;color:#5b6b85;margin-top:8px;text-align:center}
.empty{color:var(--muted);margin:6px 0}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sums div{background:var(--room-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.sums small{display:block;color:var(--muted);font-size:12px}
.sums b{font-size:18px;color:var(--brass);font-variant-numeric:tabular-nums}
.led{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.led .t{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.led .t b{color:var(--brass);font-variant-numeric:tabular-nums}
.led small{color:var(--muted);font-size:12.5px}
.names{display:flex;flex-direction:column;gap:8px}
.names input{font:inherit;font-size:16px;width:150px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--room-2);color:var(--ink)}
.names input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(10,20,40,.55);border-radius:12px}
.setup .card{background:var(--room);border:1px solid var(--brass);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;width:min(320px,100%);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.setup h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.q{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
.chips{display:flex;gap:6px}
.chips button{font:inherit;font-weight:600;font-size:16px;width:44px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--room-2);color:var(--ink);cursor:pointer}
.chips.wide button{width:auto;padding:0 10px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.chips button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.35}
</style>
<style>
/* Okey masası: üstte rakipler, ortada deste ve gösterge, altta istaka */
.felt{position:relative;background:var(--frame);border:1px solid #345a92;border-radius:16px;padding:10px;display:grid;grid-template-columns:1fr 1.25fr 1fr;grid-template-areas:". top ." "left mid right";gap:8px;box-shadow:0 8px 20px rgba(15,30,60,.35)}
.pbox{background:var(--room);border:1px solid var(--line);border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pbox.top{grid-area:top}.pbox.left{grid-area:left}.pbox.right{grid-area:right}
.pbox.turn{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.pbox .nm{font-weight:600;font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbox .pt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbox .pt b{color:var(--brass);font-size:15px}
.pbox .dz{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.mid{grid-area:mid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.midrow{display:flex;gap:10px;align-items:flex-end}
.stackBtn{position:relative;font:inherit;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.stackBtn .back{width:38px;aspect-ratio:5/7;border-radius:6px;background:var(--pt-a);border:2px solid var(--ivory);box-shadow:3px 3px 0 var(--frame-2),6px 6px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:var(--ivory);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.lbl2{font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.04em}
.okeyline{font-size:12px;color:var(--brass);text-align:center}
.can{cursor:pointer;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 6px var(--brass))}}
@media (prefers-reduced-motion:reduce){.can{animation:none;outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}}
/* Taş */
.tile{position:relative;width:100%;aspect-ratio:5/7;background:var(--ivory);border:1px solid var(--ivory-rim);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;line-height:1;box-shadow:0 2px 0 var(--ivory-rim);padding:0;font-family:var(--body);color:var(--ebony);user-select:none;-webkit-user-select:none}
.tile .n{font-size:clamp(15px,4.8vw,21px);font-variant-numeric:tabular-nums}
.tile .d{width:5px;height:5px;border-radius:50%;background:currentColor}
.tile.c0{color:#c08a12}.tile.c1{color:#1673e6}.tile.c2{color:#111418}.tile.c3{color:var(--pt-b)}
.tile.wild::after{content:"";position:absolute;inset:2px;border:2px solid var(--brass);border-radius:5px;pointer-events:none}
.tile .star{position:absolute;top:2px;right:3px;width:8px;height:8px;fill:var(--brass)}
.tile .clover{width:62%;height:auto;fill:var(--brass)}
.tile.sm{width:30px}
.tile.sm .n{font-size:15px}
.tile.xs{width:24px}
.tile.xs .n{font-size:12px}
.tile.sel{transform:translateY(-7px);box-shadow:0 0 0 2px var(--brass),0 6px 10px rgba(0,0,0,.35)}
.tile.new{box-shadow:0 0 0 2px var(--pt-b),0 2px 0 var(--ivory-rim)}
.ghost{width:30px;aspect-ratio:5/7;border:1px dashed var(--line);border-radius:6px}
/* İstaka */
.rackwrap{background:linear-gradient(var(--frame),var(--frame-2));border:1px solid #345a92;border-radius:12px;padding:8px 6px 6px;box-shadow:0 8px 18px rgba(15,30,60,.4)}
.rack{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}

<script>
var EW={p:0.8,q:1.5};
/* ===== Okey kuralları =====
   Taş: {id, c (0 sarı,1 mavi,2 siyah,3 kırmızı), n (1..13), fake (sahte okey)}
   Okey taşı: göstergenin aynı renkte bir üstü (13 ise 1). Gerçek okey jokerdir;
   sahte okey, okey taşının yerine geçer (onun renk ve sayısını taşır). */
const RENK=['Sarı','Mavi','Siyah','Kırmızı'];
function makeTiles(){const t=[];let id=0;for(let c=0;c<4;c++)for(let n=1;n<=13;n++)for(let k=0;k<2;k++)t.push({id:id++,c,n,fake:false});t.push({id:id++,c:-1,n:0,fake:true});t.push({id:id++,c:-1,n:0,fake:true});return t;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const okeyOf=g=>({c:g.c,n:g.n===13?1:g.n+1});
const isWild=(t,ok)=>!t.fake&&t.c===ok.c&&t.n===ok.n;
const valOf=(t,ok)=>t.fake?{c:ok.c,n:ok.n}:{c:t.c,n:t.n};

/* --- Per arama: sayım dizisi üzerinde, jokerlerle --- */
function countsOf(tiles,ok){
  const cnt=[];for(let c=0;c<4;c++)cnt.push(new Array(15).fill(0));let w=0;
  for(const t of tiles){if(isWild(t,ok)){w++;continue;}const v=valOf(t,ok);cnt[v.c][v.n]++;}
  return{cnt,w};
}
function keyOf(cnt,w){let k='';for(let c=0;c<4;c++)k+=cnt[c].join('')+'|';return k+w;}
function firstTile(cnt){for(let c=0;c<4;c++)for(let n=1;n<=13;n++)if(cnt[c][n]>0)return[c,n];return null;}
// En çok taş kullanan per düzeni: {used, melds:[[{c,n}|{w:1}]...]}
function solve(cnt,w,memo,build){
  const key=keyOf(cnt,w);
  if(!build&&memo.has(key))return memo.get(key);
  const f=firstTile(cnt);
  if(!f){const r={used:0,melds:[]};memo.set(key,r);return r;}
  const [c,n]=f;
  let best=null;
  const consider=(used,melds)=>{if(!best||used>best.used)best={used,melds};};
  // 1) bu taşı kullanma
  cnt[c][n]--;{const r=solve(cnt,w,memo);consider(r.used,r.melds);}cnt[c][n]++;
  // 2) seri: n'den başlar (14 = 13'ten sonraki 1)
  {
    cnt[c][n]--;const took=[];let jw=0;const seq=[{c,n}];
    for(let p=n+1;p<=14;p++){
      const src=p===14?1:p;
      if(p===14&&n===1)break;
      if(cnt[c][src]>0){cnt[c][src]--;took.push(src);seq.push({c,n:p});}
      else if(w-jw>0){jw++;took.push(-1);seq.push({w:1});}
      else break;
      if(seq.length>=3){const r=solve(cnt,w-jw,memo);consider(r.used+seq.length,[seq.slice(),...r.melds]);}
    }
    for(const s of took)if(s>0)cnt[c][s]++;
    cnt[c][n]++;
  }
  // 2b) 1 taşını 13'ten sonra kullan: 12-13-1, 11-12-13-1 ...
  if(n===1){
    cnt[c][1]--;
    for(let L=3;L<=13;L++){
      const took=[];let jw=0,ok=true;const seq=[];
      for(let p=14-L+1;p<=13;p++){
        if(cnt[c][p]>0){cnt[c][p]--;took.push(p);seq.push({c,n:p});}
        else if(w-jw>0){jw++;took.push(-1);seq.push({w:1});}
        else{ok=false;break;}
      }
      if(ok){seq.push({c,n:1});const r=solve(cnt,w-jw,memo);consider(r.used+seq.length,[seq,...r.melds]);}
      for(const s of took)if(s>0)cnt[c][s]++;
      if(!ok)break;
    }
    cnt[c][1]++;
  }
  // 3) grup: aynı sayı, farklı renk
  if(n<=13){
    const others=[0,1,2,3].filter(x=>x!==c);
    for(let mask=0;mask<8;mask++){
      const pick=others.filter((x,i)=>mask&(1<<i));
      if(pick.some(x=>cnt[x][n]<=0))continue;
      for(let j=0;j<=Math.min(w,3-pick.length);j++){
        const size=1+pick.length+j;if(size<3||size>4)continue;
        cnt[c][n]--;pick.forEach(x=>cnt[x][n]--);
        const r=solve(cnt,w-j,memo);
        const g=[{c,n},...pick.map(x=>({c:x,n})),...Array.from({length:j},()=>({w:1}))];
        consider(r.used+size,[g,...r.melds]);
        cnt[c][n]++;pick.forEach(x=>cnt[x][n]++);
      }
    }
  }
  if(!build)memo.set(key,best);
  return best;
}
function bestMelds(tiles,ok){const {cnt,w}=countsOf(tiles,ok);return solve(cnt,w,new Map());}
function pairsCount(tiles,ok){
  const {cnt,w}=countsOf(tiles,ok);let p=0,s=0;
  for(let c=0;c<4;c++)for(let n=1;n<=13;n++){p+=cnt[c][n]>>1;s+=cnt[c][n]&1;}
  if(s>w)return p+w; // jokerler tekleri eşler
  return p+s+((w-s)>>1);
}
// 14 taş tamamen perlere ya da 7 çifte dizilebiliyor mu
function handDone(tiles,ok){
  if(tiles.length!==14)return null;
  if(bestMelds(tiles,ok).used===14)return'seri';
  const {cnt,w}=countsOf(tiles,ok);let s=0;for(let c=0;c<4;c++)for(let n=1;n<=13;n++)s+=cnt[c][n]&1;
  if(s<=w&&pairsCount(tiles,ok)>=7)return'cift';
  return null;
}
// 15 taştan hangisini atınca el biter
function finishingDiscards(tiles,ok){
  const res=[];const seen=new Set();
  for(const t of tiles){
    const k=isWild(t,ok)?'W':t.fake?'F':t.c+'-'+t.n;if(seen.has(k))continue;seen.add(k);
    const rest=tiles.filter(x=>x!==t);const d=handDone(rest,ok);
    if(d)res.push({tile:t,kind:d});
  }
  return res;
}

/* --- Değerlendirme --- */
function partial(tiles,ok){
  // per olmamış ikililer: aynı renk yakın sayı, aynı sayı farklı renk
  const vs=tiles.filter(t=>!isWild(t,ok)).map(t=>valOf(t,ok));let s=0;
  for(let i=0;i<vs.length;i++)for(let j=i+1;j<vs.length;j++){
    const a=vs[i],b=vs[j];
    if(a.c===b.c){const d=Math.abs(a.n-b.n);if(d===1)s+=3;else if(d===2)s+=2;else if(d===0)s+=1;}
    else if(a.n===b.n)s+=2;
  }
  return s;
}
function evalHand(tiles,ok){
  const bm=bestMelds(tiles,ok);
  const wilds=tiles.filter(t=>isWild(t,ok)).length;
  return bm.used*10+partial(tiles,ok)*EW.p+wilds*6+pairsCount(tiles,ok)*EW.q;
}
// Bilgisayar: atılacak taş
function aiDiscard(tiles,ok,level,danger){
  const fin=finishingDiscards(tiles,ok);
  if(fin.length){fin.sort((a,b)=>(isWild(b.tile,ok)?1:0)-(isWild(a.tile,ok)?1:0));return{tile:fin[0].tile,finish:fin[0].kind,okeyOut:isWild(fin[0].tile,ok)};}
  const cands=[];const seen=new Set();
  for(const t of tiles){
    if(isWild(t,ok))continue;
    const k=t.fake?'F':t.c+'-'+t.n;if(seen.has(k))continue;seen.add(k);
    const rest=tiles.filter(x=>x!==t);
    let v=evalHand(rest,ok);
    if(level==='usta'&&danger)v-=danger(t)*6;
    if(level==='acemi')v+=(Math.random()-0.5)*30;
    else if(level==='kalfa')v+=(Math.random()-0.5)*4;
    cands.push({t,v});
  }
  if(!cands.length)return{tile:tiles[0]};
  cands.sort((a,b)=>b.v-a.v);
  return{tile:cands[0].t};
}
// Bilgisayar: yandan alsın mı
function aiTakeSide(tiles,side,ok,level){
  if(!side)return false;
  if(isWild(side,ok))return true;
  const cur=evalHand(tiles,ok);
  const withT=tiles.concat([side]);
  if(finishingDiscards(withT,ok).length)return true;
  const d=aiDiscard(withT,ok,'kalfa');
  if(d.tile===side)return false;
  const after=evalHand(withT.filter(x=>x!==d.tile),ok);
  const need=level==='usta'?4:level==='kalfa'?9:12;
  if(level==='acemi'&&Math.random()<0.4)return Math.random()<0.3;
  return after-cur>=need;
}
// Seri diz: perleri yan yana, kalanları renge göre sırala; boşluk için null
function arrangeRuns(tiles,ok){
  const bm=bestMelds(tiles,ok);
  const pool=tiles.slice();const out=[];
  const takeVal=(c,n)=>{const i=pool.findIndex(t=>!isWild(t,ok)&&(()=>{const v=valOf(t,ok);return v.c===c&&v.n===n;})());if(i<0)return null;return pool.splice(i,1)[0];};
  const takeWild=()=>{const i=pool.findIndex(t=>isWild(t,ok));return i<0?null:pool.splice(i,1)[0];};
  for(const m of bm.melds){
    const grp=[];
    for(const x of m){const t=x.w?takeWild():takeVal(x.c,x.n===14?1:x.n);if(t)grp.push(t);}
    out.push(grp);
  }
  pool.sort((a,b)=>{const wa=isWild(a,ok),wb=isWild(b,ok);if(wa!==wb)return wa?-1:1;const va=valOf(a,ok),vb=valOf(b,ok);return va.c-vb.c||va.n-vb.n;});
  return{melds:out,rest:pool};
}
function arrangePairs(tiles,ok){
  const pool=tiles.slice();const out=[];
  const wild=pool.filter(t=>isWild(t,ok));let rest=pool.filter(t=>!isWild(t,ok));
  rest.sort((a,b)=>{const va=valOf(a,ok),vb=valOf(b,ok);return va.c-vb.c||va.n-vb.n;});
  const singles=[];
  for(let i=0;i<rest.length;){
    const va=valOf(rest[i],ok);
    if(i+1<rest.length){const vb=valOf(rest[i+1],ok);if(va.c===vb.c&&va.n===vb.n){out.push([rest[i],rest[i+1]]);i+=2;continue;}}
    singles.push(rest[i]);i++;
  }
  while(wild.length&&singles.length)out.push([singles.shift(),wild.shift()]);
  return{melds:out,rest:singles.concat(wild)};
}
</script>
<script>
/* ===== Okey masası ===== */
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const W=0,B=1; // garson için: W sen, B o anki rakip
let cfg={start:10,level:'kalfa'};
try{const c=JSON.parse(localStorage.getItem('okey-cfg')||'null');if(c)cfg=Object.assign(cfg,c);}catch(e){}
if(![10,14,20].includes(cfg.start))cfg.start=10;
if(!['acemi','kalfa','usta'].includes(cfg.level))cfg.level='kalfa';
const LEVELS={acemi:'Acemi',kalfa:'Kalfa',usta:'Usta'};
function saveCfg(){try{localStorage.setItem('okey-cfg',JSON.stringify(cfg));}catch(e){}}
const NAMES=['Sen','Rıza','Şükrü','Cevdet']; // 0 sen, 1 sağ, 2 karşı, 3 sol
let myName='';
const seatName=s=>s===0?(myName||'Sen'):NAMES[s];
const S={mode:'ai',phase:'setup',match:null,hands:[[],[],[],[]],rack:new Array(24).fill(null),stack:[],disc:[[],[],[],[]],gost:null,ok:null,turn:0,need:'discard',first:[true,true,true,true],shown:[false,false,false,false],takes:[[],[],[],[]],sel:-1,newId:-1,busy:false,msg:'',gen:0,oppName:'',last:null};
const nameOf=pl=>pl===W?(myName||'Sen'):(S.oppName||'Masa');
function masaAdi(){return NAMES.map((n,i)=>seatName(i)).join(', ');}
const rackTiles=()=>S.rack.filter(Boolean);
// Türkçe -in/-ın/-un/-ün eki: Rıza’nın, Cevdet’in, Şükrü’nün
function gen(n){if(n==='Sen')return'senin';const V='aeıioöuü',lc=n.toLocaleLowerCase('tr');const v=[...lc].reverse().find(ch=>V.includes(ch))||'e';const suf={a:'ın',ı:'ın',e:'in',i:'in',o:'un',u:'un',ö:'ün',ü:'ün'}[v];return n+'’'+(V.includes(lc[lc.length-1])?'n':'')+suf;}
const tileName=t=>t.fake?'Sahte okey':`${RENK[t.c]} ${t.n}`;

/* ----- Maç ve el ----- */
function startMatch(){
  S.match={start:cfg.start,pts:[cfg.start,cfg.start,cfg.start,cfg.start],hand:0,starter:0,done:false,champ:null,loser:null};
  saveCfg();beginHand();
}
function beginHand(){
  S.gen++;resetGameOrders();
  const m=S.match;m.hand++;
  const tiles=shuffle(makeTiles());
  const gi=tiles.findIndex(t=>!t.fake);S.gost=tiles.splice(gi,1)[0];S.ok=okeyOf(S.gost);
  S.hands=[[],[],[],[]];
  for(let k=0;k<4;k++){const s=(m.starter+k)%4;S.hands[s]=tiles.splice(0,s===m.starter?15:14);}
  S.stack=tiles;S.disc=[[],[],[],[]];S.first=[true,true,true,true];S.shown=[false,false,false,false];S.takes=[[],[],[],[]];
  S.rack=new Array(24).fill(null);placeArranged(arrangeRuns(S.hands[0],S.ok));
  S.sel=-1;S.newId=-1;S.phase='play';S.turn=m.starter;S.need='discard';S.busy=false;S.last=null;
  $('handover').hidden=true;
  S.msg=`${m.hand}. el. Gösterge ${tileName(S.gost)}, okey ${RENK[S.ok.c]} ${S.ok.n}. `;
  sfxShuffle();
  startTurn();
}
function placeArranged(a){
  const slots=new Array(24).fill(null);let i=0;
  const put=t=>{if(i<24)slots[i++]=t;};
  for(const g of a.melds){
    if(i%12!==0&&(i%12)+g.length>12)i=Math.ceil(i/12)*12; // satır sonuna sığmazsa alt satıra
    for(const t of g)put(t);
    if(i%12!==0)i++;
  }
  for(const t of a.rest){while(i<24&&slots[i])i++;put(t);}
  // sığmayanlar boş yerlere
  const placed=new Set(slots.filter(Boolean).map(t=>t.id));
  const all=a.melds.flat().concat(a.rest);
  for(const t of all)if(!placed.has(t.id)){const j=slots.indexOf(null);if(j>=0)slots[j]=t;}
  S.rack=slots;
}
function startTurn(){
  const s=S.turn;
  if(s===0){
    S.need=(S.first[0]&&S.match.starter===0)?'discard':'draw';
    if(S.need==='draw'&&!S.stack.length&&!S.disc[3].length){endHand(-1);return;}
    const left=S.disc[3][S.disc[3].length-1];
    S.msg+=S.need==='draw'?(left?`Desteden ya da ${gen(seatName(3))} attığı taştan çek.`:'Desteden taş çek.'):'Bir taş seç ve at.';
    S.busy=false;render();
  }else aiTurn(s);
}
function nextTurn(){S.turn=(S.turn+1)%4;startTurn();}
// Rakip taşı: sol oyuncunun attığı
async function aiTurn(s){
  const g=S.gen;S.busy=true;render();
  await sleep(650);if(g!==S.gen)return;
  const h=S.hands[s],ok=S.ok;
  if(S.first[s]&&!S.shown[s]&&h.some(t=>!t.fake&&t.c===S.gost.c&&t.n===S.gost.n)){
    S.shown[s]=true;showGost(s);await sleep(700);if(g!==S.gen)return;
  }
  if(!(S.first[s]&&S.match.starter===s)){
    const left=(s+3)%4,side=S.disc[left][S.disc[left].length-1];
    if(side&&aiTakeSide(h,side,ok,cfg.level==='usta'?'usta':cfg.level)){
      h.push(S.disc[left].pop());S.takes[s].push(valOf(side,ok));S.last={who:s,take:'side',tile:side};sfxTick();
      S.msg+=`${seatName(s)}, ${left===0?'senin attığın':gen(seatName(left))+' attığı'} ${tileName(side)} taşını aldı. `;
    }else{
      if(!S.stack.length){endHand(-1);return;}
      h.push(S.stack.pop());S.last={who:s,take:'stack'};sfxTick();
    }
    render();await sleep(500);if(g!==S.gen)return;
  }
  EW=cfg.level==='usta'?{p:1.6,q:1.5}:{p:0.8,q:1.5};
  const next=(s+1)%4;
  const danger=t=>{if(t.fake)return 0;const v=valOf(t,ok);let d=0;for(const x of S.takes[next]){if(x.c===v.c&&Math.abs(x.n-v.n)<=2)d+=2;if(x.n===v.n&&x.c!==v.c)d+=1;}return d;};
  const d=aiDiscard(h,ok,cfg.level,danger);
  h.splice(h.indexOf(d.tile),1);S.first[s]=false;
  if(d.finish){endHand(s,d.finish,d.okeyOut,h,d.tile);return;}
  S.disc[s].push(d.tile);sfxClack();
  render();
  nextTurn();
}
function showGost(s){
  for(let i=0;i<4;i++)if(i!==s)S.match.pts[i]-=1;
  S.msg=(s===0?'Göstergeyi gösterdin, herkesten 1 puan düştü. ':`${seatName(s)} göstergeyi gösterdi, herkesten 1 puan düştü. `);
  sfxCrown();render();
  if(S.match.pts.some(p=>p<=0)){endMatchCheck();}
}
function endHand(w,kind,okeyOut,hand,lastTile){
  S.busy=true;const m=S.match;
  let pen=0,text;
  if(w<0){text='Deste bitti, el berabere.';}
  else{
    pen=(kind==='cift'||okeyOut)?4:2;
    for(let i=0;i<4;i++)if(i!==w)m.pts[i]-=pen;
    const how=kind==='cift'?'çiftten':okeyOut?'okey atarak':'';
    text=(w===0?`Elini ${how?how+' ':''}bitirdin!`:`${seatName(w)} elini ${how?how+' ':''}bitirdi.`)+` Herkesten ${pen} puan düştü.`;
    sfxCrown();
  }
  m.starter=(m.starter+1)%4;
  S.phase='handover';S.msg=text;
  const done=m.pts.some(p=>p<=0);
  const card=$('hoCard');card.replaceChildren();
  const h2=document.createElement('h2');h2.textContent=w<0?'El berabere':w===0?'Elini bitirdin!':`${seatName(w)} bitirdi`;card.append(h2);
  const p=document.createElement('p');p.textContent=w<0?text:(kind==='cift'?'Çiftten bitti: herkese −4':okeyOut?'Okey atarak bitti: herkese −4':'Normal bitiş: herkese −2');card.append(p);
  if(w>=0&&hand){
    const a=kind==='cift'?arrangePairs(hand,S.ok):arrangeRuns(hand,S.ok);
    const md=document.createElement('div');md.className='melds';
    for(const g of a.melds){const gd=document.createElement('div');gd.className='g';gd.innerHTML=g.map(t=>tileHTML(t,'xs')).join('');md.append(gd);}
    card.append(md);
    if(lastTile){const lp=document.createElement('p');lp.innerHTML='Bitiren taş: '+tileHTML(lastTile,'xs');lp.style.display='flex';lp.style.gap='6px';lp.style.justifyContent='center';lp.style.alignItems='center';card.append(lp);}
  }
  const sc=document.createElement('div');sc.className='scores';
  for(let i=0;i<4;i++){const d=document.createElement('div');if(m.pts[i]<=0)d.className='neg';d.append(seatName(i));const b=document.createElement('b');b.textContent=m.pts[i];d.append(b);sc.append(d);}
  card.append(sc);
  const btn=document.createElement('button');btn.className='btn primary';btn.style.width='100%';
  if(done){btn.textContent='Maç sonucu';btn.onclick=()=>{$('handover').hidden=true;endMatchCheck();};}
  else{btn.textContent='Sonraki el';btn.onclick=()=>beginHand();}
  card.append(btn);
  $('handover').hidden=false;btn.focus();
  render();
}
function endMatchCheck(){
  const m=S.match;if(m.done)return;
  if(!m.pts.some(p=>p<=0))return;
  S.gen++;
  let champ=0,loser=0;for(let i=1;i<4;i++){if(m.pts[i]>m.pts[champ])champ=i;if(m.pts[i]<m.pts[loser])loser=i;}
  m.done=true;m.champ=champ;m.loser=loser;S.phase='over';S.busy=false;
  const score=m.pts.join('–');
  let st=null;
  if(champ===0){S.oppName='Masa';st=settleMatch(W,score);}
  else if(loser===0){S.oppName=seatName(champ);st=settleMatch(B,score);}
  else{S.oppName=seatName(loser);const total=payTab(B,score);st=total?{text:`Hesabı ${seatName(loser)} ödedi: ${money(total)}.`,short:`Hesabı ${seatName(loser)} ödedi`}:null;}
  m.paid=st;
  S.msg=(champ===0?'Maçı kazandın!':`Maçı ${seatName(champ)} kazandı.`)+` ${seatName(loser)} sıfırlandı.`+(st?' '+st.text:'');
  render();
}

function drawFrom(src){
  if(S.phase!=='play'||S.turn!==0||S.busy||S.need!=='draw')return;
  let t;
  if(src==='side'){t=S.disc[3].pop();if(!t)return;S.takes[0].push(valOf(t,S.ok));}
  else{if(!S.stack.length){endHand(-1);return;}t=S.stack.pop();}
  const j=S.rack.indexOf(null);S.rack[j]=t;S.newId=t.id;S.sel=-1;
  S.hands[0]=rackTiles();S.need='discard';sfxTick();
  if(S.first[0]&&!S.shown[0]){} // gösterge ilk turda gösterilebilir
  S.msg=finishingDiscards(S.hands[0],S.ok).length?'Elin bitmeye hazır! Atacağın taşı seç ve Bitir’e bas.':'Atacağın taşı seç ve At’a bas.';
  render();
}
function onSlot(i){
  if(S.phase!=='play'&&S.phase!=='handover'&&S.phase!=='over')return;
  const t=S.rack[i];
  if(S.sel<0){if(t){S.sel=i;sfxTick();render();}return;}
  if(S.sel===i){S.sel=-1;render();return;}
  // yer değiştir
  const a=S.rack[S.sel];S.rack[S.sel]=S.rack[i];S.rack[i]=a;S.sel=-1;render();
}
function throwSel(finish){
  if(S.phase!=='play'||S.turn!==0||S.busy||S.need!=='discard')return;
  if(S.sel<0||!S.rack[S.sel]){S.msg='Önce atacağın taşı seç.';render();return;}
  const t=S.rack[S.sel];
  const rest=rackTiles().filter(x=>x!==t);
  if(finish){
    const kind=handDone(rest,S.ok);
    if(!kind){S.msg='Bu taşı atınca elin bitmiyor. Perlerini kontrol et.';render();return;}
    S.rack[S.sel]=null;S.sel=-1;S.hands[0]=rackTiles();S.first[0]=false;
    endHand(0,kind,isWild(t,S.ok),rest,t);return;
  }
  if(isWild(t,S.ok)&&!finish){S.msg='Okeyi atarsan rakibin işine yarar. Yine de atmak için tekrar At’a bas.';if(S._okWarn!==t.id){S._okWarn=t.id;render();return;}}
  S.rack[S.sel]=null;S.sel=-1;S.newId=-1;S.hands[0]=rackTiles();S.first[0]=false;
  S.disc[0].push(t);sfxClack();S.msg='';
  nextTurn();
}
function gost(){
  if(S.turn!==0||!S.first[0]||S.shown[0])return;
  if(!rackTiles().some(t=>!t.fake&&t.c===S.gost.c&&t.n===S.gost.n))return;
  S.shown[0]=true;showGost(0);
}
function sortRack(kind){
  const tiles=rackTiles();S.sel=-1;
  placeArranged(kind==='pair'?arrangePairs(tiles,S.ok):arrangeRuns(tiles,S.ok));sfxTick();render();
}

let snd={fx:true};
try{const v=JSON.parse(localStorage.getItem('tavla-sound')||'null');if(v)snd=Object.assign(snd,v);}catch(e){}
const A={ctx:null,fx:null,noise:null};
function ac(){
  if(!A.ctx){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{A.ctx=new C();}catch(e){return null;}
    const c=A.ctx;
    A.fx=c.createGain();A.fx.gain.value=0.8;A.fx.connect(c.destination);
        const len=c.sampleRate*3,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.06*w)/1.06;d[i]=w*0.6+last*2.4;}
    A.noise=b;
  }
  if(A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});
  return A.ctx;
}
function knock(t,freq,dur,gain,q,dest){
  const c=A.ctx;
  const src=c.createBufferSource();src.buffer=A.noise;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=q||6;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(gain,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp);bp.connect(g);g.connect(dest||A.fx);src.start(t,Math.random()*2);src.stop(t+dur+0.03);
  const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(freq*0.45,t);o.frequency.exponentialRampToValueAtTime(freq*0.3,t+dur);
  const g2=c.createGain();g2.gain.setValueAtTime(gain*0.45,t);g2.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.8);
  o.connect(g2);g2.connect(dest||A.fx);o.start(t);o.stop(t+dur+0.02);
}
function clink(t,gain,dest){
  const c=A.ctx,base=2900+Math.random()*500;
  for(const [r,dk,gg] of [[1,0.55,1],[1.53,0.35,0.55],[2.17,0.22,0.35],[2.8,0.15,0.2]]){
    const o=c.createOscillator();o.type='sine';o.frequency.value=base*r;
    const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(gain*gg*0.25,t+0.003);g.gain.exponentialRampToValueAtTime(0.0001,t+dk);
    o.connect(g);g.connect(dest||A.fx);o.start(t);o.stop(t+dk+0.02);
  }
}
function sfxDice(){
  if(!snd.fx)return;const c=ac();if(!c)return;
  let t=c.currentTime+0.01;
  for(let i=0;i<9;i++){t+=0.022+Math.random()*0.03;knock(t,2600+Math.random()*1800,0.03,0.25+Math.random()*0.25,9);}
  t+=0.09;
  for(const [dt,f,g] of [[0,1500,0.9],[0.075,1750,0.6],[0.15,1600,0.42],[0.205,1850,0.26],[0.245,1700,0.15]])knock(t+dt+Math.random()*0.01,f,0.06,g,4);
}
function sfxClack(){if(!snd.fx)return;const c=ac();if(!c)return;const t=c.currentTime+0.003;knock(t,1700+Math.random()*350,0.085,0.9,5);knock(t+0.01,800,0.07,0.35,3);}
function sfxHit(){if(!snd.fx)return;const c=ac();if(!c)return;const t=c.currentTime+0.003;knock(t,2100,0.07,1,5);knock(t+0.06,1600,0.08,0.8,5);}
function sfxSlide(){if(!snd.fx)return;const c=ac();if(!c)return;const t=c.currentTime+0.003;knock(t,1100,0.12,0.5,2);}
function sfxClink(){if(!snd.fx)return;const c=ac();if(!c)return;const t=c.currentTime+0.01;clink(t,1);clink(t+0.11,0.6);}

let db=null,uid=null,readOnly=false;
async function initAccount(){
  const use=window.claude&&window.claude.use;
  if(!use){setGuest();return;}
  const user=await window.claude.use('user');if(!user){setGuest();return;}
  const me=await user.me();$('avatar').src=me.avatarUrl;$('who').textContent=me.name||'Giriş yapıldı';
  myName=(me.name||'').trim().split(/\s+/)[0]||'';render();
}
function setGuest(){$('who').textContent='Misafir';$('whoSub').textContent='Misafir olarak oynuyorsun';}
